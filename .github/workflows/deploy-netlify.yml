name: Build & Verify for Netlify CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Lint & Type Check
        run: npm run lint

      - name: Build Production Assets
        run: npm run build

      - name: Verify Dist Output
        run: |
          test -d dist || { echo "dist directory not generated"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html not generated"; exit 1; }
          echo "Production build verified successfully for Netlify!"
