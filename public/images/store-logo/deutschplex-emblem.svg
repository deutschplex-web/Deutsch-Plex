<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">

  <defs>
    <radialGradient id="dp-bronze-hub" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="35%" stop-color="#b88655" />
      <stop offset="75%" stop-color="#966336" />
      <stop offset="100%" stop-color="#6e431f" />
    </radialGradient>
    <linearGradient id="dp-hex-charcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282c35" />
      <stop offset="50%" stop-color="#1d2128" />
      <stop offset="100%" stop-color="#121419" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 0) scale(1.0)">
    <!-- 1. Outer Solid Hexagon (Dark Charcoal/Slate) -->
    <polygon
      points="150.0,18.0 264.3,84.0 264.3,216.0 150.0,282.0 35.7,216.0 35.7,84.0"
      fill="url(#dp-hex-charcoal)"
      stroke="#121419"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <!-- 2. Inner Hexagonal Flange Plate (Gainsboro Silver) -->
    <polygon
      points="150.0,38.0 247.0,94.0 247.0,206.0 150.0,262.0 53.0,206.0 53.0,94.0"
      fill="#dce1e9"
      stroke="#181b22"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Inset Line on Hexagonal Flange -->
    <polygon
      points="150.0,49.0 237.5,99.5 237.5,200.5 150.0,251.0 62.5,200.5 62.5,99.5"
      fill="none"
      stroke="#181b22"
      stroke-width="1.8"
      opacity="0.9"
    />

    <!-- 3. 6 Corner Mounting Bolts with Inset Recesses -->
    <g>
      <circle cx="150.0" cy="60.0" r="6.5" fill="#dce1e9" stroke="#181b22" stroke-width="2.2" />
      <circle cx="150.0" cy="60.0" r="2.5" fill="#181b22" />

      <circle cx="227.9" cy="105.0" r="6.5" fill="#dce1e9" stroke="#181b22" stroke-width="2.2" />
      <circle cx="227.9" cy="105.0" r="2.5" fill="#181b22" />

      <circle cx="227.9" cy="195.0" r="6.5" fill="#dce1e9" stroke="#181b22" stroke-width="2.2" />
      <circle cx="227.9" cy="195.0" r="2.5" fill="#181b22" />

      <circle cx="150.0" cy="240.0" r="6.5" fill="#dce1e9" stroke="#181b22" stroke-width="2.2" />
      <circle cx="150.0" cy="240.0" r="2.5" fill="#181b22" />

      <circle cx="72.1" cy="195.0" r="6.5" fill="#dce1e9" stroke="#181b22" stroke-width="2.2" />
      <circle cx="72.1" cy="195.0" r="2.5" fill="#181b22" />

      <circle cx="72.1" cy="105.0" r="6.5" fill="#dce1e9" stroke="#181b22" stroke-width="2.2" />
      <circle cx="72.1" cy="105.0" r="2.5" fill="#181b22" />
    </g>

    <!-- 4. Central Aperture (Dark Slate Circular Cavity) -->
    <circle cx="150" cy="150" r="70" fill="#181b22" stroke="#121419" stroke-width="1.5" />

    <!-- 5. Rotor Assembly & Gear Cogs -->
    <g>
      <!-- Gear Cogs (12 Silver Teeth) -->
      <path d="M 203.0,150.0 L 214.9,144.9 L 214.9,155.1 L 203.0,150.0 L 195.9,123.5 L 206.1,114.3 L 211.2,123.1 L 199.1,128.9 L 176.5,104.1 L 183.6,92.0 L 191.0,99.3 L 181.9,109.5 L 150.0,97.0 L 154.9,85.1 L 162.7,87.2 L 156.0,98.9 L 123.5,104.1 L 124.7,91.8 L 132.9,91.8 L 129.9,104.1 L 104.1,123.5 L 100.9,111.6 L 107.9,107.5 L 108.9,120.7 L 97.0,150.0 L 85.1,145.1 L 87.2,137.3 L 98.9,144.0 L 104.1,176.5 L 91.8,175.3 L 91.8,167.1 L 104.1,170.1 L 123.5,195.9 L 111.6,199.1 L 107.5,192.1 L 120.7,191.1 L 150.0,203.0 L 145.1,214.9 L 137.3,212.8 L 144.0,201.1 L 176.5,195.9 L 175.3,208.2 L 167.1,208.2 L 170.1,195.9 L 195.9,176.5 L 199.1,188.4 L 192.1,192.5 L 191.1,179.3 Z" fill="#dce1e9" stroke="#181b22" stroke-width="1" />
      <circle cx="150" cy="150" r="53" fill="#dce1e9" />

      <!-- Dark Rotor Track -->
      <circle cx="150" cy="150" r="48" fill="#181b22" />

      <!-- Rotor Drilled Cooling Holes -->
      <circle cx="188.8" cy="166.1" r="2.4" fill="#dce1e9" />
      <circle cx="166.1" cy="188.8" r="2.4" fill="#dce1e9" />
      <circle cx="133.9" cy="188.8" r="2.4" fill="#dce1e9" />
      <circle cx="111.2" cy="166.1" r="2.4" fill="#dce1e9" />
      <circle cx="111.2" cy="133.9" r="2.4" fill="#dce1e9" />
      <circle cx="133.9" cy="111.2" r="2.4" fill="#dce1e9" />
      <circle cx="166.1" cy="111.2" r="2.4" fill="#dce1e9" />
      <circle cx="188.8" cy="133.9" r="2.4" fill="#dce1e9" />
    </g>

    <!-- 6. Crimson Red Friction Segments (4 arcs) -->
    <path d="M 170.7,119.3 L 178.0,108.5 A 50 50 0 0 1 193.7,125.8 L 182.4,132.1 A 37 37 0 0 0 170.7,119.3 Z" fill="#cc1e28" />
    <path d="M 183.3,133.8 L 194.9,128.1 A 50 50 0 0 1 200.0,150.0 L 187.0,150.0 A 37 37 0 0 0 183.3,133.8 Z" fill="#cc1e28" />
    <path d="M 186.9,151.9 L 199.9,152.6 A 50 50 0 0 1 193.7,174.2 L 182.4,167.9 A 37 37 0 0 0 186.9,151.9 Z" fill="#cc1e28" />
    <path d="M 181.4,169.6 L 192.4,176.5 A 50 50 0 0 1 178.0,191.5 L 170.7,180.7 A 37 37 0 0 0 181.4,169.6 Z" fill="#cc1e28" />

    <!-- 7. Central Metallic Bronze Axle Hub -->
    <circle cx="150" cy="150" r="28" fill="url(#dp-bronze-hub)" stroke="#181b22" stroke-width="2.2" />
    <circle cx="150" cy="150" r="22" fill="none" stroke="#7e532b" stroke-width="0.8" opacity="0.5" />

    <!-- Mechanical 6-Point Star / Spline Cutout -->
    <polygon
      points="150.0,137.0 153.5,143.9 161.3,143.5 157.0,150.0 161.3,156.5 153.5,156.1 150.0,163.0 146.5,156.1 138.7,156.5 143.0,150.0 138.7,143.5 146.5,143.9"
      fill="#181b22"
      stroke="#121419"
      stroke-width="1"
    />
    <circle cx="150" cy="150" r="3" fill="#b88755" />

    <!-- 8. Scalloped Brake Caliper on the Right -->
    <g>
      <!-- Top Lug & Mounting Pin -->
      <rect x="183" y="92" width="6" height="12" rx="1.5" fill="#181b22" stroke="#dce1e9" stroke-width="1.8" />
      <line x1="186" y1="86" x2="186" y2="96" stroke="#dce1e9" stroke-width="2" stroke-linecap="round" />

      <!-- Bottom Lug & Mounting Pin -->
      <rect x="183" y="196" width="6" height="12" rx="1.5" fill="#181b22" stroke="#dce1e9" stroke-width="1.8" />
      <line x1="186" y1="204" x2="186" y2="214" stroke="#dce1e9" stroke-width="2" stroke-linecap="round" />

      <!-- Main Caliper Body with 4 Scalloped Lobes & Silver Outline -->
      <path
        d="M 178,104 C 192,104 208,112 210,124 C 211,130 206,133 210,140 C 214,147 214,153 210,160 C 206,167 211,170 210,176 C 208,188 192,196 178,196 C 188,181 193,166 193,150 C 193,134 188,119 178,104 Z"
        fill="#181b22"
        stroke="#dce1e9"
        stroke-width="2.2"
        stroke-linejoin="round"
      />
      <path
        d="M 187,114 C 198,127 201,139 201,150 C 201,161 198,173 187,186"
        fill="none"
        stroke="#3a3f4d"
        stroke-width="1.5"
      />
    </g>
  </g>
</svg>